version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: joulewise-rag-backend
    ports:
      - "5005:5005"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # You can override .env variables here if needed
      - NEO4J_URI=${NEO4J_URI:-bolt://host.docker.internal:7687}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: always

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    container_name: joulewise-rag-ui
    ports:
      - "3006:80"
    restart: always
